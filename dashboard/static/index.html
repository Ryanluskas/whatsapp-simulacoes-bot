<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Central de operação das simulações via WhatsApp." />
  <title>Allana · Central de Simulações</title>

  <!-- Nenhum recurso externo: o painel é uma ferramenta de operação local e
       precisa abrir mesmo sem internet. Tipografia do sistema, gráficos em
       SVG próprio e tempo real por EventSource nativo. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23848CF3'/%3E%3Cstop offset='1' stop-color='%234E4CC3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Cpath d='M12.2 28.6 L20 11.6 L27.8 28.6' stroke='white' stroke-width='2.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16.1 22.4 H23.9' stroke='white' stroke-width='2.7' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#view">Ir para o conteúdo</a>

  <!-- ===================================================== LOGIN ======= -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <div id="login-logo"></div>
      <p class="sub">Central de Simulações</p>
      <form id="login-form" novalidate>
        <label for="login-password">Senha de acesso</label>
        <input type="password" id="login-password" class="input"
               autocomplete="current-password" placeholder="••••••••" required />
        <button type="submit" id="login-btn" class="btn primary block">Entrar</button>
        <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- ===================================================== APLICAÇÃO === -->
  <div id="app" class="app hidden" data-nav="closed">
    <aside class="sidebar">
      <div class="brand" id="sidebar-logo"></div>

      <nav id="nav" class="nav" aria-label="Navegação principal"></nav>

      <div class="sidebar-foot">
        <span id="wa-dot-mini" class="dot" data-state="disconnected"></span>
        <span id="wa-mini-label">WhatsApp</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn icon menu-btn" type="button" aria-label="Abrir menu">☰</button>
        <div>
          <h2 id="view-title">Visão geral</h2>
          <div id="crumb" class="crumb">Painel</div>
        </div>

        <div class="topbar-actions">
          <div class="search">
            <input id="global-search" type="search"
                   placeholder="Buscar consultor, contrato, ID…  ( / )"
                   aria-label="Busca global" />
          </div>

          <div class="conn">
            <span id="wa-dot" class="dot" data-state="disconnected"></span>
            <div>
              <strong id="wa-label">Conectando…</strong>
              <span id="wa-meta" class="meta"></span>
            </div>
            <span id="stream-dot" class="dot" data-state="error"
                  title="Conexão ao vivo" aria-label="Estado da conexão ao vivo"></span>
          </div>

          <button id="logout" class="btn icon" type="button" aria-label="Sair" title="Sair">⏻</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="region" aria-live="polite" aria-label="Notificações"></div>
  <div id="modal-root" class="modal-root hidden"></div>

  <script type="module" src="/js/app.js"></script>
  <noscript>
    <p style="padding:24px">Este painel precisa de JavaScript habilitado.</p>
  </noscript>
</body>
</html>
