<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Allana Bot — central de operação das simulações via WhatsApp." />
  <title>Allana Bot</title>

  <!-- Nenhum recurso externo: o painel é uma ferramenta de operação local e
       precisa abrir mesmo sem internet. Tipografia do sistema, gráficos em
       SVG próprio e tempo real por EventSource nativo. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
</head>
<body>
  <a class="skip-link" href="#view">Ir para o conteúdo</a>

  <!-- ===================================================== LOGIN ======= -->
  <div id="login" class="login hidden">
    <main class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img class="avatar" data-shape="app" src="/img/allana-logo.webp" width="88" height="88"
             alt="" decoding="async" />
        <div>
          <h1 id="login-title">Allana Bot</h1>
          <p>Central de simulações</p>
        </div>
      </div>
      <form id="login-form" novalidate>
        <label for="login-password">Senha de acesso</label>
        <input type="password" id="login-password" class="input"
               autocomplete="current-password" placeholder="Digite a senha" required
               aria-describedby="login-error" />
        <button type="submit" id="login-btn" class="btn primary block">Entrar</button>
        <div id="login-error" class="form-error" role="alert" aria-live="polite"></div>
      </form>
      <p class="login-foot">Acesso restrito à operação.</p>
    </main>
  </div>

  <!-- ===================================================== APLICAÇÃO === -->
  <div id="app" class="app hidden" data-nav="closed">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
      <div class="sb-brand">
        <img class="avatar" src="/img/allana-avatar.webp" width="40" height="40" alt="" decoding="async" />
        <div class="who">
          <div class="name">Allana Bot</div>
          <div class="role">Assistente operacional</div>
          <div class="presence" id="presence">
            <span id="presence-dot" class="dot" data-tone="neutral"></span>
            <span id="presence-label">Conectando…</span>
          </div>
        </div>
        <button id="sb-close" class="btn ghost icon sm sb-close" type="button" aria-label="Fechar menu"></button>
      </div>

      <nav id="nav" class="nav" aria-label="Navegação principal"></nav>

      <div class="sidebar-foot">
        <div class="line" title="Eventos em tempo real">
          <span id="stream-dot" class="dot" data-tone="error"></span>
          <span id="stream-label">Reconectando…</span>
        </div>
      </div>
    </aside>
    <button id="nav-overlay" class="nav-overlay" type="button" tabindex="-1" aria-label="Fechar menu"></button>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn icon menu-btn" type="button"
                aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="page-heading">
          <h1 id="view-title">Visão geral</h1>
          <p id="view-subtitle"></p>
        </div>

        <div class="topbar-actions">
          <div class="search">
            <input id="global-search" type="search"
                   placeholder="Buscar consultor, contrato, ID…"
                   aria-label="Buscar solicitações (atalho: /)" />
          </div>

          <div class="conn" role="status" aria-live="polite">
            <span id="wa-dot" class="dot" data-tone="neutral"></span>
            <span class="sr-only">WhatsApp:</span>
            <strong id="wa-label">Conectando…</strong>
            <span class="sep" aria-hidden="true"></span>
            <span id="wa-meta" class="meta"></span>
          </div>

          <button id="logout" class="btn ghost icon" type="button" aria-label="Sair" data-tip="Sair" data-tip-pos="bottom"></button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="region" aria-live="polite" aria-label="Notificações"></div>
  <div id="modal-root" class="modal-root hidden"></div>
  <div id="drawer-root"></div>

  <script type="module" src="/js/app.js"></script>
  <noscript>
    <p style="padding:24px">Este painel precisa de JavaScript habilitado.</p>
  </noscript>
</body>
</html>
